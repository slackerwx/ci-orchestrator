name: promote
on:
  workflow_call:
    inputs:
      image_repository: { required: true, type: string }
      image_tag: { required: true, type: string }
      expect_deny: { required: false, type: boolean, default: false }
      tenant: { required: false, type: string, default: time-payments }
      namespace: { required: false, type: string, default: prod-payments }
      app: { required: false, type: string, default: payments-api }
      port: { required: false, type: string, default: '8080' }
    secrets:
      VLAB_URL: { required: true }
      VLAB_INGEST_TOKEN: { required: true }
      ENV_PUSH_TOKEN: { required: true }

permissions:
  contents: read

env:
  ENV_REPO: slackerwx/virtualab-env
  TENANT_FILE: gitops/tenants/${{ inputs.tenant }}/tenant.yaml

jobs:
  bump:
    name: bump
    runs-on: [self-hosted, vlab]
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: ensure yq
        run: |
          [ -x /usr/local/bin/yq ] || { sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq; }
      - name: clone, bump and push
        id: commit
        env:
          ENV_PUSH_TOKEN: ${{ secrets.ENV_PUSH_TOKEN }}
          IMAGE_REPO: ${{ inputs.image_repository }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          TENANT: ${{ inputs.tenant }}
        run: |
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          git clone --depth 10 "https://x-access-token:${ENV_PUSH_TOKEN}@github.com/${ENV_REPO}.git" "$WORK"
          cd "$WORK"
          yq -i '.image.repository = strenv(IMAGE_REPO) | .image.tag = strenv(IMAGE_TAG)' "$TENANT_FILE"
          git add "$TENANT_FILE"
          # --allow-empty: re-promoting the same version still produces a narratable commit (spec §6.1) and a new revision for sync to track
          git -c user.name=vlab-promoter -c user.email=vlab-promoter@users.noreply.github.com \
            commit --allow-empty -m "promote: ${TENANT} -> ${IMAGE_TAG}"
          git push origin main
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          curl -sf --max-time 30 --retry 2 -X POST "${{ secrets.VLAB_URL }}/api/ingest/event" \
            -H "authorization: Bearer ${{ secrets.VLAB_INGEST_TOKEN }}" -H "content-type: application/json" \
            -d "{\"type\":\"image.promoted\",\"payload\":{\"image\":\"$IMAGE_REPO\",\"tag\":\"$IMAGE_TAG\",\"sha\":\"$SHA\",\"commitUrl\":\"https://github.com/${ENV_REPO}/commit/$SHA\"}}" || true

  sync:
    name: sync
    needs: bump
    runs-on: [self-hosted, vlab]
    steps:
      - name: force refresh and wait for the revision
        env:
          TENANT: ${{ inputs.tenant }}
          NS: ${{ inputs.namespace }}
          APP_NAME: ${{ inputs.app }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          APP="tenant-${TENANT}"
          sudo kubectl -n argocd annotate application "$APP" argocd.argoproj.io/refresh=normal --overwrite || true
          IMG=""; STATUS=""
          # the tenant Application points at the charts repo — with applicationset, sync.revision is never the bump sha; what proves the promotion is the tag materialized in the Deployment + Synced
          # 240s window: covers the worst case of the applicationset git generator requeue (3min) + rollout
          for i in $(seq 1 120); do
            IMG=$(sudo kubectl -n "$NS" get deploy "$APP_NAME" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
            STATUS=$(sudo kubectl -n argocd get application "$APP" -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            case "$IMG" in *:"$IMAGE_TAG") [ "$STATUS" = "Synced" ] && break ;; esac
            sleep 2
          done
          case "$IMG" in *:"$IMAGE_TAG") ;; *) echo "deploy did not materialize tag $IMAGE_TAG (current image: $IMG; sync: $STATUS)"; exit 1 ;; esac
          HEALTH=$(sudo kubectl -n argocd get application "$APP" -o jsonpath='{.status.health.status}' 2>/dev/null || true)
          curl -sf --max-time 30 --retry 2 -X POST "${{ secrets.VLAB_URL }}/api/ingest/event" \
            -H "authorization: Bearer ${{ secrets.VLAB_INGEST_TOKEN }}" -H "content-type: application/json" \
            -d "{\"type\":\"argocd.synced\",\"payload\":{\"app\":\"$APP\",\"revision\":\"${{ needs.bump.outputs.sha }}\",\"syncStatus\":\"$STATUS\",\"health\":\"$HEALTH\"}}" || true

  gate:
    name: gate
    needs: [bump, sync]
    runs-on: [self-hosted, vlab]
    steps:
      - name: admission verdict
        env:
          APP_NAME: ${{ inputs.app }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          NS="${{ inputs.namespace }}"
          if [ "${{ inputs.expect_deny }}" = "true" ]; then
            MSG=""
            for i in $(seq 1 60); do
              MSG=$(sudo kubectl -n "$NS" get events -o json | \
                jq -r '[.items[] | select(.reason == "FailedCreate") | select(.message | contains("require-signed-images"))] | sort_by(.lastTimestamp) | last | .message // empty')
              [ -n "$MSG" ] && break; sleep 2
            done
            [ -n "$MSG" ] || { echo "expected deny was not observed within 120s"; exit 1; }
            SHORT=$(printf '%s' "$MSG" | tr '\n"' ' ' | cut -c1-220)
            curl -sf --max-time 30 --retry 2 -X POST "${{ secrets.VLAB_URL }}/api/ingest/event" \
              -H "authorization: Bearer ${{ secrets.VLAB_INGEST_TOKEN }}" -H "content-type: application/json" \
              -d "{\"type\":\"admission.verdict\",\"payload\":{\"allowed\":false,\"policy\":\"require-signed-images\",\"message\":\"$SHORT\"}}" || true
            echo "gate denied (expected): $SHORT"
            exit 1
          else
            IMG=""
            # select the pod that carries the promoted TAG and is Ready — during a rolling update there are 2 pods and .items[0] could read the previous promotion's digest
            for i in $(seq 1 90); do
              IMG=$(sudo kubectl -n "$NS" get pods -l app="$APP_NAME" -o jsonpath='{range .items[*]}{.spec.containers[0].image}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' 2>/dev/null | grep ":$IMAGE_TAG@.*True" | head -n1 | awk '{print $1}') || true
              [ -n "$IMG" ] && break; sleep 2
            done
            [ -n "$IMG" ] || { echo "pod for tag $IMAGE_TAG did not become Ready within 180s"; sudo kubectl -n "$NS" get pods; exit 1; }
            case "$IMG" in *@sha256:*) ;; *) echo "image not pinned by digest: $IMG"; exit 1;; esac
            DIGEST="sha256:${IMG#*@sha256:}"
            curl -sf --max-time 30 --retry 2 -X POST "${{ secrets.VLAB_URL }}/api/ingest/event" \
              -H "authorization: Bearer ${{ secrets.VLAB_INGEST_TOKEN }}" -H "content-type: application/json" \
              -d "{\"type\":\"admission.verdict\",\"payload\":{\"allowed\":true,\"policy\":\"require-signed-images\",\"digest\":\"$DIGEST\"}}" || true
          fi

  live:
    name: live
    needs: gate
    if: ${{ !inputs.expect_deny }}
    runs-on: [self-hosted, vlab]
    steps:
      - name: real http response via port-forward
        run: |
          NS="${{ inputs.namespace }}"; APP="${{ inputs.app }}"; PORT="${{ inputs.port }}"
          sudo kubectl -n "$NS" port-forward "svc/$APP" 18080:"$PORT" >/dev/null 2>&1 &
          PF=$!
          trap 'sudo kill $PF 2>/dev/null || true' EXIT
          sleep 3
          START=$(date +%s%3N)
          set +e
          RESP=$(curl -sf --max-time 10 -w '\n%{http_code}' http://127.0.0.1:18080/)
          STATUS=$?
          set -e
          END=$(date +%s%3N)
          [ $STATUS -eq 0 ] || { echo "app did not respond"; exit 1; }
          HTTP_STATUS=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d' | tr -d '\n"' | cut -c1-120)
          curl -sf --max-time 30 --retry 2 -X POST "${{ secrets.VLAB_URL }}/api/ingest/event" \
            -H "authorization: Bearer ${{ secrets.VLAB_INGEST_TOKEN }}" -H "content-type: application/json" \
            -d "{\"type\":\"app.live\",\"payload\":{\"status\":$HTTP_STATUS,\"latencyMs\":$((END - START)),\"bodyExcerpt\":\"$BODY\"}}" || true

  revert:
    name: revert
    needs: [bump, gate]
    if: ${{ always() && inputs.expect_deny && needs.bump.result == 'success' }}
    runs-on: [self-hosted, vlab]
    steps:
      - name: git revert the bump
        env:
          ENV_PUSH_TOKEN: ${{ secrets.ENV_PUSH_TOKEN }}
        run: |
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          git clone --depth 10 "https://x-access-token:${ENV_PUSH_TOKEN}@github.com/${ENV_REPO}.git" "$WORK"
          cd "$WORK"
          git -c user.name=vlab-promoter -c user.email=vlab-promoter@users.noreply.github.com \
            revert --no-edit "${{ needs.bump.outputs.sha }}"
          git push origin main
          SHA=$(git rev-parse HEAD)
          curl -sf --max-time 30 --retry 2 -X POST "${{ secrets.VLAB_URL }}/api/ingest/event" \
            -H "authorization: Bearer ${{ secrets.VLAB_INGEST_TOKEN }}" -H "content-type: application/json" \
            -d "{\"type\":\"image.reverted\",\"payload\":{\"sha\":\"$SHA\",\"commitUrl\":\"https://github.com/${ENV_REPO}/commit/$SHA\"}}" || true
