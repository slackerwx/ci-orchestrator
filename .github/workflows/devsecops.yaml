name: devsecops
on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
    secrets:
      VLAB_URL:
        required: true
      VLAB_INGEST_TOKEN:
        required: true
    outputs:
      image_tag:
        description: tag da imagem publicada (sha do commit)
        value: ${{ jobs.package.outputs.image_tag }}
      digest:
        description: digest da imagem publicada
        value: ${{ jobs.package.outputs.digest }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: inputs.language == 'go'
        run: go build ./...
      - if: inputs.language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: inputs.language == 'node'
        run: npm ci
      - if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: inputs.language == 'java'
        run: mvn -B -q package -DskipTests
      - if: inputs.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - if: inputs.language == 'dotnet'
        run: dotnet build
      - if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: inputs.language == 'python'
        run: pip install -r requirements.txt

  sast:
    name: sast
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install semgrep==1.172.0
      - run: semgrep scan --config auto --sarif --output semgrep.sarif || true
      - run: >
          curl -sf --max-time 30 --retry 2 -X POST "$VLAB_URL/api/ingest/sarif"
          -H "authorization: Bearer $VLAB_INGEST_TOKEN"
          -H "content-type: application/json"
          --data-binary @semgrep.sarif
        env:
          VLAB_URL: ${{ secrets.VLAB_URL }}
          VLAB_INGEST_TOKEN: ${{ secrets.VLAB_INGEST_TOKEN }}

  secrets_scan:
    name: secrets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source /repo -f sarif -r /repo/gitleaks.sarif || true
      - run: >
          curl -sf --max-time 30 --retry 2 -X POST "$VLAB_URL/api/ingest/sarif"
          -H "authorization: Bearer $VLAB_INGEST_TOKEN"
          -H "content-type: application/json"
          --data-binary @gitleaks.sarif
        env:
          VLAB_URL: ${{ secrets.VLAB_URL }}
          VLAB_INGEST_TOKEN: ${{ secrets.VLAB_INGEST_TOKEN }}

  vuln:
    name: vuln
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
      - run: >
          curl -sf --max-time 30 --retry 2 -X POST "$VLAB_URL/api/ingest/sarif"
          -H "authorization: Bearer $VLAB_INGEST_TOKEN"
          -H "content-type: application/json"
          --data-binary @trivy.sarif
        env:
          VLAB_URL: ${{ secrets.VLAB_URL }}
          VLAB_INGEST_TOKEN: ${{ secrets.VLAB_INGEST_TOKEN }}

  package:
    name: package
    needs: [sast, secrets_scan, vuln]
    runs-on: ubuntu-latest
    env:
      VLAB_URL: ${{ secrets.VLAB_URL }}
      VLAB_INGEST_TOKEN: ${{ secrets.VLAB_INGEST_TOKEN }}
    outputs:
      image_tag: ${{ github.sha }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - run: >
          curl -sf --max-time 30 --retry 2 -X POST "$VLAB_URL/api/ingest/event"
          -H "authorization: Bearer $VLAB_INGEST_TOKEN"
          -H "content-type: application/json"
          -d "{\"type\":\"image.pushed\",\"payload\":{\"image\":\"${{ env.IMAGE }}:${{ github.sha }}\",\"digest\":\"${{ steps.push.outputs.digest }}\"}}"
      - uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.json
          upload-artifact: false
      - run: |
          PKGS=$(jq '.packages | length' sbom.json)
          curl -sf --max-time 30 --retry 2 -X POST "$VLAB_URL/api/ingest/event" \
            -H "authorization: Bearer $VLAB_INGEST_TOKEN" \
            -H "content-type: application/json" \
            -d "{\"type\":\"sbom.created\",\"payload\":{\"packages\":$PKGS,\"format\":\"spdx-json\"}}"
      - uses: sigstore/cosign-installer@v4.1.2
      # formato legado .sig: o verifyImages do kyverno 3.8.x nao le o bundle novo do cosign 3.x
      - run: cosign sign --yes --new-bundle-format=false --use-signing-config=false --registry-referrers-mode=legacy "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
      - run: >
          curl -sf --max-time 30 --retry 2 -X POST "$VLAB_URL/api/ingest/event"
          -H "authorization: Bearer $VLAB_INGEST_TOKEN"
          -H "content-type: application/json"
          -d "{\"type\":\"image.signed\",\"payload\":{\"digest\":\"${{ steps.push.outputs.digest }}\",\"issuer\":\"https://token.actions.githubusercontent.com\"}}"
