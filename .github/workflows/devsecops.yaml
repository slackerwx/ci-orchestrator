name: devsecops
on:
  workflow_call:
    inputs:
      language:
        description: go | node | java | dotnet | python
        required: true
        type: string
    secrets:
      VLAB_URL:
        required: true
      VLAB_INGEST_TOKEN:
        required: true
    outputs:
      image_tag:
        description: published image tag (sha-<commit sha>)
        value: ${{ jobs.outputs.outputs.image_tag }}
      digest:
        description: published image digest
        value: ${{ jobs.outputs.outputs.digest }}

permissions: {}

jobs:
  config:
    name: config
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      port: ${{ steps.map.outputs.port }}
      health: ${{ steps.map.outputs.health }}
    steps:
      - id: map
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          # health must name a route the sample actually serves: the DAST readiness probe is
          # `curl -fsS`, so the pipeline's default of / reads a 404 as "never came up" and the
          # stage times out against a healthy container. Only sample-go serves / at all.
          case "$LANGUAGE" in
            node) port=3000; health=/health ;;
            python) port=5000; health=/health ;;
            go) port=8080; health=/ ;;
            java|dotnet) port=8080; health=/health ;;
            *) echo "unsupported language: $LANGUAGE"; exit 1 ;;
          esac
          echo "port=$port" >> "$GITHUB_OUTPUT"
          echo "health=$health" >> "$GITHUB_OUTPUT"

  pipeline:
    name: pipeline
    needs: config
    # devsecops-pipeline declares the minimum per job and a reusable workflow can only narrow what
    # the caller granted, so every one of these must also be granted by the VirtuaLab caller job.
    # Missing any of them fails the run at startup with zero jobs created.
    permissions:
      contents: read
      packages: write        # image job pushes to GHCR, sign job attaches the signature
      id-token: write        # keyless cosign signing mints an OIDC token
      pull-requests: write   # evidence job's sticky findings comment
      security-events: write # evidence job declares it even with upload-sarif off
    uses: slackerwx/devsecops-pipeline/.github/workflows/pipeline.yml@5f3c7881de9f62a1c9334b3467a1b9cdbcc95258  # v1.0.1
    with:
      stack: ${{ inputs.language }}
      mode: audit                      # the samples carry planted CVEs on purpose
      push: always
      cosign-signature-format: legacy  # kyverno 3.8.x verifyImages reads .sig tags
      app-port: ${{ needs.config.outputs.port }}
      app-health-path: ${{ needs.config.outputs.health }}
    secrets:
      EVIDENCE_WEBHOOK_URL: ${{ format('{0}/api/ingest', secrets.VLAB_URL) }}
      EVIDENCE_WEBHOOK_TOKEN: ${{ secrets.VLAB_INGEST_TOKEN }}

  outputs:
    name: outputs
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      image_tag: sha-${{ github.sha }}
      digest: ${{ needs.pipeline.outputs.digest }}
    steps:
      - env:
          DIGEST: ${{ needs.pipeline.outputs.digest }}
        run: echo "image_tag=sha-${GITHUB_SHA} digest=${DIGEST}"
